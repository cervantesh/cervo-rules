sonar.projectKey=cervosoft_cervo-rules
sonar.projectName=CervoRules
sonar.projectVersion=v3.0.0-rc.3

sonar.sources=.
sonar.tests=.
sonar.test.inclusions=**/*_test.go
sonar.go.coverage.reportPaths=coverage.out

sonar.exclusions=\
  **/.git/**,\
  **/.github/**,\
  **/.analysis/**,\
  **/dist/**,\
  **/tmp/**,\
  **/coverage.out,\
  **/*.md,\
  **/*.json,\
  **/*.yaml,\
  **/*.yml,\
  **/*.sh

sonar.coverage.exclusions=\
  **/*_test.go,\
  examples/**

sonar.sourceEncoding=UTF-8

# Test files intentionally keep readable scenario tables and assertion blocks.
# Keep cognitive-complexity enforcement focused on production and generator code.
sonar.issue.ignore.multicriteria=e1
sonar.issue.ignore.multicriteria.e1.ruleKey=go:S3776
sonar.issue.ignore.multicriteria.e1.resourceKey=**/*_test.go
